[project]
name = "neural-racer"
version = "0.1.0"
description = "Train neural cars on uploaded racetracks with a minimal local viewer"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.3,<3",
    "pillow>=12.2,<14",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "wsproto>=1.2,<2",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
